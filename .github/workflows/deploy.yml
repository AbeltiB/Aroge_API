name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aroge_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm ci doesn't run this on its own (no postinstall hook) — without
      # it, every import of src/generated/prisma/client fails outright.
      - run: npx prisma generate

      - run: cp .env.test.example .env.test

      # Empty, ephemeral, CI-only database — safe to push straight to
      # without the interactive confirmation prisma db push normally wants.
      - name: Push schema to the test database
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/aroge_test

      # `npm run typecheck` (tsc --noEmit) is deliberately NOT run here —
      # confirmed via a real CI run that it OOMs on the standard runner even
      # at a 6GB heap ceiling (Prisma 7's generated types are large enough
      # that this repo's own `build` script already sidesteps full checking
      # with `tsc --noCheck`, not just locally). Runtime/logic correctness
      # is covered by the test suite below; full type-checking on this repo
      # needs a bigger runner or a structural fix — see tests/README.md.
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/abeltib/aroge-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/aroge
            docker compose pull api
            docker compose up -d api
            docker image prune -f
